
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Letter For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment: #EDE0C8;
    --parchment-dark: #E1D0AC;
    --paper-shadow: #c9b98d;
    --wax-red: #8B1A1A;
    --wax-red-dark: #6b1212;
    --wax-red-light: #a83232;
    --ink: #3B2A20;
    --ink-soft: #5c4632;
    --gold: #a3822f;
    --envelope: #d8c7a1;
    --envelope-dark: #c3b088;
    --envelope-inner: #b89f6f;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at top, #4a3a2a 0%, #241a12 70%);
    font-family: 'EB Garamond', serif;
    color: var(--ink);
    overflow-x:hidden;
  }

  .stage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 20px;
    position:relative;
  }

  /* subtle floating dust/light */
  .stage::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(1px 1px at 20% 30%, rgba(255,235,190,0.25), transparent),
      radial-gradient(1px 1px at 70% 60%, rgba(255,235,190,0.2), transparent),
      radial-gradient(1px 1px at 40% 80%, rgba(255,235,190,0.18), transparent),
      radial-gradient(1px 1px at 85% 20%, rgba(255,235,190,0.2), transparent);
    pointer-events:none;
  }

  /* ============ ENVELOPE ============ */
  .envelope-wrap{
    position:relative;
    width: min(420px, 88vw);
    aspect-ratio: 3/2;
    perspective: 1600px;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .envelope-wrap.hidden{
    opacity:0;
    transform: scale(0.85) translateY(-10px);
    pointer-events:none;
  }

  .envelope-hint{
    position:absolute;
    bottom:-42px;
    left:0;
    right:0;
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:15px;
    letter-spacing:0.08em;
    color: #d8c7a1;
    opacity:0.75;
    animation: pulseHint 2.4s ease-in-out infinite;
  }

  @keyframes pulseHint{
    0%,100%{ opacity:0.4; }
    50%{ opacity:0.85; }
  }

  .envelope{
    position:absolute;
    inset:0;
    cursor:pointer;
  }

  .env-body{
    position:absolute;
    inset:0;
    background: linear-gradient(155deg, var(--envelope) 0%, var(--envelope-dark) 100%);
    border-radius: 4px;
    box-shadow:
      0 25px 60px -15px rgba(0,0,0,0.7),
      0 10px 20px -8px rgba(0,0,0,0.5),
      inset 0 0 40px rgba(139,26,26,0.04);
    overflow:hidden;
  }

  /* envelope inner pocket triangles (side + bottom flaps look) */
  .env-body::before{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:60%;
    background: linear-gradient(160deg, var(--envelope-inner), var(--envelope-dark) 70%);
    clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
    opacity:0.9;
  }

  .env-body::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
    mix-blend-mode: overlay;
  }

  .env-flap{
    position:absolute;
    top:0; left:0; right:0;
    height:58%;
    background: linear-gradient(200deg, var(--envelope-dark) 0%, var(--envelope) 55%, var(--envelope-dark) 100%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transform-style: preserve-3d;
    transition: transform 1.1s cubic-bezier(.6,-0.15,.2,1.15);
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    z-index:5;
  }

  .env-flap::after{
    content:"";
    position:absolute;
    inset:0;
    background-image: repeating-linear-gradient(70deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 1px, transparent 1px, transparent 4px);
  }

  .envelope.open .env-flap{
    transform: rotateX(178deg);
    z-index:1;
  }

  /* wax seal */
  .wax-seal{
    position:absolute;
    top:55%;
    left:50%;
    width: 74px;
    height:74px;
    transform: translate(-50%,-50%);
    z-index: 10;
    transition: transform 0.6s ease, opacity 0.5s ease 0.15s;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.45));
  }

  .wax-seal svg{ width:100%; height:100%; display:block; }

  .envelope:hover .wax-seal:not(.cracked){
    transform: translate(-50%,-50%) scale(1.05);
  }

  .wax-seal.cracked{
    animation: crackPop 0.5s ease forwards;
  }

  @keyframes crackPop{
    0%{ transform: translate(-50%,-50%) scale(1); }
    35%{ transform: translate(-50%,-50%) scale(1.15) rotate(-3deg); }
    100%{
      transform: translate(-50%,-50%) scale(0.6) rotate(8deg) translateY(-140px);
      opacity:0;
    }
  }

  .crack-piece{
    opacity:0;
    transition: opacity 0.15s ease;
  }
  .wax-seal.cracked .crack-piece{ opacity:1; }
  .wax-seal.cracked .seal-whole{ opacity:0; }

  /* ============ LETTER ============ */
  .letter-wrap{
    position: fixed;
    left:50%;
    top:50%;
    width: min(560px, 90vw);
    max-height: 84vh;
    transform: translate(-50%,-46%) scale(0.7);
    opacity:0;
    pointer-events:none;
    transition: opacity 0.9s ease, transform 0.9s cubic-bezier(.2,.8,.2,1);
    z-index: 20;
  }

  .letter-wrap.visible{
    opacity:1;
    transform: translate(-50%,-50%) scale(1);
    pointer-events:auto;
  }

  .letter-paper{
    position:relative;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.35), transparent 40%),
      linear-gradient(180deg, var(--parchment) 0%, var(--parchment-dark) 100%);
    border-radius: 2px;
    padding: 52px 44px 44px;
    max-height: 84vh;
    overflow-y: auto;
    box-shadow:
      0 40px 90px -20px rgba(0,0,0,0.75),
      0 15px 35px -10px rgba(0,0,0,0.6);
    background-image:
      linear-gradient(180deg, var(--parchment) 0%, var(--parchment-dark) 100%),
      repeating-radial-gradient(circle at 30% 20%, rgba(120,90,50,0.05) 0, rgba(120,90,50,0.05) 1px, transparent 1px, transparent 60px);
  }

  .letter-paper::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(circle at 8% 92%, rgba(120,90,40,0.12), transparent 22%),
      radial-gradient(circle at 95% 8%, rgba(120,90,40,0.1), transparent 20%),
      radial-gradient(circle at 90% 90%, rgba(120,90,40,0.08), transparent 25%);
  }

  .close-btn{
    position:absolute;
    top:10px;
    right:14px;
    background:none;
    border:none;
    font-family:'Cormorant Garamond', serif;
    font-size: 26px;
    color: var(--ink-soft);
    opacity:0.5;
    cursor:pointer;
    line-height:1;
    padding:8px;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .close-btn:hover{ opacity:0.9; transform: rotate(90deg); }
  .close-btn:focus-visible{ outline: 2px solid var(--wax-red); outline-offset:2px; opacity:1;}

  .letter-greeting{
    font-family: 'Great Vibes', cursive;
    font-size: 44px;
    color: var(--wax-red-dark);
    margin: 0 0 18px;
    line-height:1;
  }

  .letter-body{
    font-family: 'Cormorant Garamond', serif;
    font-size: 21px;
    line-height: 1.85;
    color: var(--ink);
    text-align:left;
  }

  .letter-body p{ margin: 0 0 22px; }

  .word{
    opacity:0;
    filter: blur(3px);
    display:inline-block;
    transform: translateY(6px);
    animation: wordIn 0.6s ease forwards;
  }

  @keyframes wordIn{
    to{ opacity:1; filter: blur(0); transform: translateY(0); }
  }

  .letter-sign{
    margin-top: 8px;
    font-family: 'Great Vibes', cursive;
    font-size: 30px;
    color: var(--wax-red-dark);
    opacity:0;
    transition: opacity 1s ease;
  }
  .letter-sign.show{ opacity:1; }

  .letter-paper::-webkit-scrollbar{ width:8px; }
  .letter-paper::-webkit-scrollbar-thumb{ background: var(--paper-shadow); border-radius:4px; }
  .letter-paper::-webkit-scrollbar-track{ background: transparent; }

  @media (prefers-reduced-motion: reduce){
    .word{ animation: none; opacity:1; filter:none; transform:none; }
    .env-flap, .wax-seal, .letter-wrap{ transition: none !important; animation: none !important; }
  }

  @media (max-width: 480px){
    .letter-body{ font-size: 18px; }
    .letter-greeting{ font-size: 36px; }
    .letter-paper{ padding: 44px 26px 32px; }
  }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
</style>
</head>
<body>

<div class="stage">

  <div class="envelope-wrap" id="envelopeWrap">
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open the sealed letter">
      <div class="env-body"></div>
      <div class="env-flap" id="envFlap"></div>

      <div class="wax-seal" id="waxSeal">
        <svg viewBox="0 0 100 100" class="seal-whole">
          <defs>
            <radialGradient id="waxGrad" cx="35%" cy="30%" r="75%">
              <stop offset="0%" stop-color="#b23a3a"/>
              <stop offset="55%" stop-color="#8B1A1A"/>
              <stop offset="100%" stop-color="#5e1010"/>
            </radialGradient>
          </defs>
          <!-- irregular wax blob -->
          <path d="M50 6 C68 4 82 14 88 30 C94 45 92 60 84 72 C76 85 60 94 45 92 C30 90 15 82 9 66 C3 50 8 32 20 20 C28 11 40 8 50 6 Z"
                fill="url(#waxGrad)" stroke="#3f0a0a" stroke-width="1"/>
          <!-- pacifier emblem pressed into wax -->
          <g transform="translate(50,50)" fill="none" stroke="#e8c9a0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
            <circle cx="0" cy="-4" r="13" />
            <circle cx="0" cy="-4" r="5.5" fill="#e8c9a0" stroke="none" opacity="0.55"/>
            <path d="M -9 8 C -9 16 9 16 9 8" />
            <rect x="-6" y="15" width="12" height="7" rx="3" />
            <circle cx="0" cy="26" r="3.4" />
          </g>
          <!-- subtle rim highlight -->
          <path d="M50 6 C68 4 82 14 88 30 C94 45 92 60 84 72" fill="none" stroke="#d97a5a" stroke-width="1" opacity="0.35"/>
        </svg>

        <!-- cracked halves shown after click -->
        <svg viewBox="0 0 100 100" class="crack-piece" style="position:absolute; inset:0;">
          <defs>
            <radialGradient id="waxGrad2" cx="35%" cy="30%" r="75%">
              <stop offset="0%" stop-color="#b23a3a"/>
              <stop offset="55%" stop-color="#8B1A1A"/>
              <stop offset="100%" stop-color="#5e1010"/>
            </radialGradient>
          </defs>
          <path d="M50 6 C68 4 82 14 88 30 C90 40 90 48 86 55 L52 50 L50 6 Z" fill="url(#waxGrad2)" stroke="#3f0a0a" stroke-width="1"/>
          <path d="M9 66 C3 50 8 32 20 20 C28 11 40 8 50 6 L52 50 L14 60 Z" fill="url(#waxGrad2)" stroke="#3f0a0a" stroke-width="1"/>
        </svg>
      </div>
    </div>
    <p class="envelope-hint">tap the seal to open</p>
  </div>

  <div class="letter-wrap" id="letterWrap" aria-live="polite">
    <div class="letter-paper" id="letterPaper" tabindex="-1">
      <button class="close-btn" id="closeBtn" aria-label="Close letter">&#10005;</button>
      <h1 class="letter-greeting" id="letterGreeting"></h1>
      <div class="letter-body" id="letterBody"></div>
      <p class="letter-sign" id="letterSign">From, your favorite human.<br>(I hope.)</p>
    </div>
  </div>

</div>

<script>
(function(){
  const envelope = document.getElementById('envelope');
  const envelopeWrap = document.getElementById('envelopeWrap');
  const waxSeal = document.getElementById('waxSeal');
  const letterWrap = document.getElementById('letterWrap');
  const letterPaper = document.getElementById('letterPaper');
  const letterGreeting = document.getElementById('letterGreeting');
  const letterBody = document.getElementById('letterBody');
  const letterSign = document.getElementById('letterSign');
  const closeBtn = document.getElementById('closeBtn');

  const greeting = "Hey, Ram!";

  const paragraphs = [
    "I am grateful for every wrong turn that led me to you &lt;3 Every delay, every chapter I didn't understand somehow guided me to the greatest blessing of my life\u2014 You !!!",
    "You have no idea how beautiful you are in my eyes. The way you look, the way you love, the way you care, the way your heart carries so much calm and composure.",
    "Thank you for being the person I can pray for. Thank you for being my answered prayer. Thank you for giving me countless reasons to wake up every day with a grateful heart.",
    "Thank you for keeping me going, running, surviving, and LIVING!!"
  ];

  let opened = false;

  function buildLetterMarkup(){
    letterBody.innerHTML = '';
    let globalDelay = 0;
    const wordStep = 0.075; // seconds between words

    paragraphs.forEach((para) => {
      const p = document.createElement('p');
      const words = para.split(' ');
      words.forEach((w, i) => {
        const span = document.createElement('span');
        span.className = 'word';
        span.innerHTML = w + (i < words.length - 1 ? '&nbsp;' : '');
        span.style.animationDelay = globalDelay.toFixed(2) + 's';
        globalDelay += wordStep;
        p.appendChild(span);
      });
      letterBody.appendChild(p);
      globalDelay += wordStep * 4; // pause between paragraphs
    });

    // greeting fades in first, letter body follows, signature after body
    letterGreeting.textContent = '';
    let gi = 0;
    letterGreeting.style.opacity = 0;
    letterGreeting.style.transition = 'opacity 0.8s ease';
    requestAnimationFrame(() => {
      letterGreeting.textContent = greeting;
      letterGreeting.style.opacity = 1;
    });

    const totalTime = globalDelay + 0.6;
    setTimeout(() => {
      letterSign.classList.add('show');
    }, totalTime * 1000);
  }

  function openLetter(){
    if(opened) return;
    opened = true;

    waxSeal.classList.add('cracked');

    setTimeout(() => {
      envelope.classList.add('open');
    }, 250);

    setTimeout(() => {
      envelopeWrap.classList.add('hidden');
      buildLetterMarkup();
      letterWrap.classList.add('visible');
      letterPaper.focus({preventScroll:true});
    }, 1050);
  }

  function closeLetter(){
    letterWrap.classList.remove('visible');
    setTimeout(() => {
      opened = false;
      envelope.classList.remove('open');
      waxSeal.classList.remove('cracked');
      envelopeWrap.classList.remove('hidden');
      letterBody.innerHTML = '';
      letterGreeting.textContent = '';
      letterSign.classList.remove('show');
    }, 700);
  }

  envelope.addEventListener('click', openLetter);
  envelope.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      openLetter();
    }
  });
  closeBtn.addEventListener('click', closeLetter);
})();
</script>

</body>
</html>
